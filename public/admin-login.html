<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - AuraFocus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin-shell">
  <main class="admin-auth-card">
    <div class="hero-badge">ADMIN ONLY</div>
    <h1 class="admin-auth-title">AuraFocus Console</h1>
    <p class="admin-auth-copy">Use the authorized Google account to access the private admin console.</p>

    <p id="admin-login-error" class="admin-auth-error" aria-live="polite"></p>
    <a href="/admin/login/google" class="btn btn-primary btn-large admin-auth-btn" style="justify-content: center; text-decoration: none;">
      Continue with Google
    </a>
    <a class="auth-back-link" href="/">Back to AuraFocus</a>
  </main>

  <script>
    const errorEl = document.getElementById("admin-login-error");
    if (new URLSearchParams(window.location.search).get("error") === "unauthorized") {
      errorEl.textContent = "That Google account is not authorized for the admin console.";
    }
  </script>
</body>
</html>
