<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - AuraFocus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

<body class="admin-shell">
  <main class="admin-auth-card">
    <div class="hero-badge">GOOGLE SIGN-IN</div>
    <h1 class="admin-auth-title">Welcome to AuraFocus</h1>
    <p class="admin-auth-copy">Use your Google account to sign in. Google securely manages your password and account recovery.</p>

    <a href="/login/google" class="btn btn-primary btn-large admin-auth-btn" style="justify-content: center; text-decoration: none;">

    <a class="auth-back-link" href="/">Back to AuraFocus</a>
