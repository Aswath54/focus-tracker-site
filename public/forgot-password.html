<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Forgot Password - AuraFocus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin-shell">
  <main class="admin-auth-card">
    <div class="hero-badge">ACCOUNT RECOVERY</div>
    <h1 class="admin-auth-title">Forgot your password?</h1>
    <p class="admin-auth-copy">Enter your account email and we’ll send a one-time reset link if an account exists.</p>

    <form id="forgot-password-form" class="admin-auth-form">
      <label class="admin-auth-label" for="email">Email</label>
      <input id="email" name="email" type="email" class="admin-auth-input" autocomplete="email" required maxlength="254" />
      <button id="submit-button" type="submit" class="btn btn-primary btn-large admin-auth-btn">Send Reset Link</button>
      <p id="forgot-error" class="admin-auth-error" aria-live="polite"></p>
    </form>

    <p id="forgot-success" class="auth-success" role="status" hidden>
      If an account exists for that email, a password reset link has been sent. Check your inbox and spam folder.
    </p>
    <a class="auth-back-link" href="/login.html">Back to login</a>
  </main>

  <script>
    const form = document.getElementById("forgot-password-form");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submit-button");
    const errorEl = document.getElementById("forgot-error");
    const successEl = document.getElementById("forgot-success");
    const initialEmail = new URLSearchParams(window.location.search).get("email");

    if (initialEmail) {
      emailInput.value = initialEmail;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = "Sending…";

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value.trim() }),
        });

        if (!response.ok) {
          throw new Error("We couldn’t process that request. Please try again.");
        }

        form.hidden = true;
        successEl.hidden = false;
      } catch (error) {
        errorEl.textContent = error.message || "We couldn’t process that request. Please try again.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
