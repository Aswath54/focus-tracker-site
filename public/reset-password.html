<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Password - AuraFocus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin-shell">
  <main class="admin-auth-card">
    <div class="hero-badge">ACCOUNT RECOVERY</div>
    <h1 class="admin-auth-title">Set a new password</h1>
    <p class="admin-auth-copy">Choose a new password for your AuraFocus account. The reset link can only be used once.</p>

    <form id="reset-password-form" class="admin-auth-form">
      <label class="admin-auth-label" for="password">New password</label>
      <input id="password" name="password" type="password" class="admin-auth-input" autocomplete="new-password" minlength="8" maxlength="256" required />
      <label class="admin-auth-label" for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirmPassword" type="password" class="admin-auth-input" autocomplete="new-password" minlength="8" maxlength="256" required />
      <button id="submit-button" type="submit" class="btn btn-primary btn-large admin-auth-btn">Reset Password</button>
      <p id="reset-error" class="admin-auth-error" aria-live="polite"></p>
    </form>

    <p id="reset-success" class="auth-success" role="status" hidden>
      Your password has been reset. You can now sign in with your new password.
    </p>
    <a id="login-link" class="auth-back-link" href="/login.html">Go to login</a>
  </main>

  <script>
    const form = document.getElementById("reset-password-form");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const submitButton = document.getElementById("submit-button");
    const errorEl = document.getElementById("reset-error");
    const successEl = document.getElementById("reset-success");
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    // Keep the token out of browser history and future referrer headers after loading it.
    if (token) {
      window.history.replaceState({}, document.title, window.location.pathname);
    } else {
      form.hidden = true;
      errorEl.textContent = "This reset link is missing. Request a new one to continue.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";

      if (passwordInput.value.length < 8) {
        errorEl.textContent = "Password must be at least 8 characters.";
        return;
      }
      if (passwordInput.value !== confirmPasswordInput.value) {
        errorEl.textContent = "Passwords do not match.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Resetting…";

      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: passwordInput.value }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "This reset link is invalid or expired. Request a new one.");
        }

        form.hidden = true;
        successEl.hidden = false;
      } catch (error) {
        errorEl.textContent = error.message || "We couldn’t reset your password. Please try again.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
